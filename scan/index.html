<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Saardha</title>
  <meta name="description" content="On-demand local delivery" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5a623" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Saardha" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f13;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .app-logo { font-size: 40px; margin-bottom: 4px; }
    .app-name { font-size: 20px; font-weight: 700; color: #f5a623; margin-bottom: 2px; }
    .app-tagline { font-size: 12px; color: #666; margin-bottom: 28px; }
    .divider { border: none; border-top: 1px solid #2a2a3a; margin: 24px 0; }
    .vendor-emoji { font-size: 60px; margin-bottom: 14px; }
    .vendor-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .vendor-meta { font-size: 13px; color: #888; margin-bottom: 12px; }
    .ready-badge {
      display: inline-block;
      background: rgba(245,166,35,0.12);
      color: #f5a623;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 28px;
    }
    .added-banner {
      background: rgba(76,175,80,0.1);
      border: 1px solid rgba(76,175,80,0.25);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #4caf50;
    }
    .added-banner strong { display: block; font-size: 15px; margin-bottom: 3px; }
    .already-banner {
      background: rgba(245,166,35,0.08);
      border: 1px solid rgba(245,166,35,0.2);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #f5a623;
    }
    .already-banner strong { display: block; font-size: 15px; margin-bottom: 3px; }
    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      text-decoration: none;
      text-align: center;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #f5a623; color: #0f0f13; }
    .btn-ghost { background: #252535; color: #f0f0f0; }
    .stores-count { font-size: 12px; color: #555; margin-top: 14px; }
    .stores-count span { color: #f5a623; font-weight: 600; }
    .feature-list { font-size: 12px; color: #555; margin-top: 16px; line-height: 2; }
    .loading { color: #666; font-size: 14px; }
    .error { color: #f55; font-size: 14px; margin-bottom: 16px; }
    .countdown { font-size: 12px; color: #555; margin-top: 12px; }
    .ios-hint {
      display: none;
      margin-top: 14px;
      background: #252535;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: #aaa;
      text-align: left;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="loading">Loading…</div>
  </div>

  <script>
    const API_BASE    = "https://sardha.onrender.com";
    const STORAGE_KEY = "bw_unlocked_vendors";
    let currentVendor = null;
    // Always open the installable PWA (never the API backend). Carry the store id
    // so the customer app adds it automatically on open.
    function customerUrl(v) { return "/customer/" + ((v && v.id) ? ("?v=" + encodeURIComponent(v.id)) : ""); }

    /* ── Device detection ── */
    function isAndroid() {
      return /android/i.test(navigator.userAgent);
    }
    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
    }
    function isInstalled() {
      return window.navigator.standalone === true
          || window.matchMedia("(display-mode: standalone)").matches;
    }

    /* ── PWA install prompt (Android/Chrome) ── */
    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById("installBtn");
      if (btn) btn.textContent = "📲 Install Saardha";
    });
    // After a successful install, open the app straight into their store
    window.addEventListener("appinstalled", () => {
      window.location.href = customerUrl(currentVendor);
    });
    async function triggerInstall() {
      if (!deferredPrompt) return false;
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch (e) {}
      deferredPrompt = null;
      return true;
    }

    /* ── localStorage helpers ── */
    function getUnlocked() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }
    function addVendor(id) {
      const list = getUnlocked();
      if (list.includes(id)) return false;
      list.push(id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      return true;
    }

    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

    async function fetchAllVendors() {
      try { const res = await fetch(API_BASE + "/api/public/vendors"); if (res.ok) return await res.json(); } catch {}
      return [];
    }

    function distKm(la1, lo1, la2, lo2) {
      if (la1 == null || lo1 == null || la2 == null || lo2 == null) return Infinity;
      const R = 6371, toR = (d) => (d * Math.PI) / 180;
      const dLa = toR(la2 - la1), dLo = toR(lo2 - lo1);
      const a = Math.sin(dLa / 2) ** 2 + Math.cos(toR(la1)) * Math.cos(toR(la2)) * Math.sin(dLo / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // Universal-QR landing: location-aware, filterable picker (scales to many stores).
    async function showStorePicker() {
      const card = document.getElementById("card");
      card.innerHTML = `
        <div class="app-logo">🚚</div>
        <div class="app-name">Saardha</div>
        <div class="app-tagline" id="pickerTag">Choose your store</div>
        <input id="storeSearch" placeholder="🔍 Search store name / area…" autocomplete="off"
          style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2a2a3a;background:#0f0f13;color:#f0f0f0;margin:16px 0 10px;font-size:15px" />
        <div id="storeCats" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px"></div>
        <div id="storeList" style="max-height:48vh;overflow:auto;text-align:left"><div class="loading">Loading stores…</div></div>
        <a class="btn btn-ghost" href="/customer/" style="margin-top:12px">Open app without a store</a>
      `;
      const vendors = await fetchAllVendors();
      const listEl = document.getElementById("storeList");
      const searchEl = document.getElementById("storeSearch");
      const catsEl = document.getElementById("storeCats");
      const tagEl = document.getElementById("pickerTag");
      let myPos = null, activeCat = "";

      // Category filter chips (derived from the stores).
      const cats = Array.from(new Set(vendors.map((v) => (v.category || "").trim()).filter(Boolean))).sort();
      function renderCats() {
        catsEl.innerHTML = "";
        [["", "All"]].concat(cats.map((c) => [c, c])).forEach(([val, label]) => {
          const chip = document.createElement("button");
          chip.textContent = label;
          chip.style.cssText = "flex:0 0 auto;padding:6px 12px;border-radius:16px;border:1px solid #2a2a3a;font-size:12px;cursor:pointer;white-space:nowrap;background:" + (activeCat === val ? "#f5a623" : "#252535") + ";color:" + (activeCat === val ? "#0f0f13" : "#ddd");
          chip.onclick = () => { activeCat = val; renderCats(); renderList(searchEl.value); };
          catsEl.appendChild(chip);
        });
      }
      renderCats();

      function renderList(q) {
        const query = (q || "").toLowerCase().trim();
        let filtered = vendors.filter((v) =>
          (!activeCat || (v.category || "") === activeCat) &&
          (!query || (String(v.name) + " " + String(v.category) + " " + String(v.area)).toLowerCase().includes(query)));
        if (myPos) filtered = filtered.map((v) => ({ ...v, _d: distKm(myPos.lat, myPos.lng, v.lat, v.lng) })).sort((a, b) => a._d - b._d);
        if (!vendors.length) { listEl.innerHTML = '<div class="loading">No stores available yet.</div>'; return; }
        if (!filtered.length) { listEl.innerHTML = '<div class="loading">No stores match. Try a different search or category.</div>'; return; }
        // Cap the visible rows so the list is never a giant scroll; search/filter narrows further.
        const shown = filtered.slice(0, 40);
        listEl.innerHTML = "";
        shown.forEach((v) => {
          const near = (myPos && isFinite(v._d)) ? '<span style="color:#4caf50;font-size:11px;margin-left:6px">· ' + v._d.toFixed(1) + ' km</span>' : "";
          const row = document.createElement("div");
          row.style.cssText = "display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:#252535;margin-bottom:8px;cursor:pointer";
          row.innerHTML = '<div style="font-size:26px">' + esc(v.img || "🏪") + '</div>' +
            '<div style="flex:1;min-width:0"><div style="font-weight:700">' + esc(v.name) + near + '</div>' +
            '<div style="font-size:12px;color:#888">' + esc(v.category || "") + " · " + esc(v.area || "") + '</div></div>' +
            '<div style="color:#f5a623;font-size:18px">→</div>';
          row.onclick = () => { addVendor(v.id); window.location.href = customerUrl(v); };
          listEl.appendChild(row);
        });
        if (filtered.length > shown.length) {
          const more = document.createElement("div");
          more.style.cssText = "text-align:center;color:#666;font-size:12px;padding:6px";
          more.textContent = "+ " + (filtered.length - shown.length) + " more — search to narrow down";
          listEl.appendChild(more);
        }
      }
      renderList("");
      if (searchEl) searchEl.addEventListener("input", (e) => renderList(e.target.value));

      // Ask for location → sort nearest-first (the store you're standing at floats to the top).
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (p) => { myPos = { lat: p.coords.latitude, lng: p.coords.longitude }; if (tagEl) tagEl.textContent = "Stores near you"; renderList(searchEl.value); },
          () => {}, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
        );
      }
    }

    async function fetchVendor(id) {
      try {
        const res = await fetch(API_BASE + "/api/public/vendors/" + id);
        if (res.ok) return await res.json();
      } catch {}
      return null;
    }

    function startCountdown(secs, cb) {
      let rem = secs;
      const el = document.getElementById("countdown");
      if (!el) return;
      el.textContent = "Redirecting in " + rem + "s…";
      const t = setInterval(() => {
        rem--;
        if (el) el.textContent = "Redirecting in " + rem + "s…";
        if (rem <= 0) { clearInterval(t); cb(); }
      }, 1000);
    }

    /* ── Android PWA install UI ── */
    function showAndroidInstall(vendor) {
      const card = document.getElementById("card");
      card.innerHTML = `
        <div class="app-logo">🚚</div>
        <div class="app-name">Saardha</div>
        <div class="app-tagline">On-demand local delivery</div>
        <hr class="divider" />
        <div class="vendor-emoji">${vendor ? vendor.img : "🏪"}</div>
        <div class="vendor-name">${vendor ? vendor.name : "Saardha"}</div>
        <div class="vendor-meta">${vendor ? vendor.category + " · " + vendor.area : "Local delivery"}</div>
        <div class="ready-badge">⚡ Ready to deliver</div>
        <button class="btn btn-primary" id="installBtn">📲 Install Saardha</button>
        <a class="btn" href="${customerUrl(vendor)}" id="openBtn"
           style="display:block;margin-top:10px;background:transparent;border:1px solid #444;color:#ddd">Open in browser →</a>
        <div class="ios-hint" id="installHint" style="display:block;margin-top:14px">
          <strong>To install:</strong> tap <strong>Install Saardha</strong>. If nothing pops up,
          open the browser menu <strong>⋮</strong> (top-right) and choose <strong>Install app</strong> /
          <strong>Add to Home screen</strong>. Or tap <strong>Open in browser</strong> to start ordering now.
        </div>
      `;
      document.getElementById("installBtn").addEventListener("click", async () => {
        const installed = await triggerInstall();
        if (!installed) {
          // No native prompt available in this browser — guide + let them proceed
          document.getElementById("installHint").innerHTML =
            "Open the browser menu <strong>⋮</strong> (top-right) and tap <strong>Install app</strong> / " +
            "<strong>Add to Home screen</strong>. Or tap <strong>Open in browser</strong> below to start ordering now.";
        }
      });
    }

    /* ── iOS PWA install UI ── */
    function showIOSInstall(vendor) {
      const card = document.getElementById("card");
      card.innerHTML = `
        <div class="app-logo">🚚</div>
        <div class="app-name">Saardha</div>
        <div class="app-tagline">On-demand local delivery</div>
        <hr class="divider" />
        <div class="vendor-emoji">${vendor ? vendor.img : "🏪"}</div>
        <div class="vendor-name">${vendor ? vendor.name : "Saardha"}</div>
        <div class="ready-badge">⚡ Ready to deliver</div>
        <a class="btn btn-primary" href="${customerUrl(vendor)}">Open App →</a>
        <div class="ios-hint" style="display:block;margin-top:14px">
          📲 To install on iPhone:<br>
          Tap the <strong>Share</strong> button (□↑) in Safari,
          then choose <strong>"Add to Home Screen"</strong>
        </div>
      `;
    }

    async function init() {
      const card = document.getElementById("card");
      const params = new URLSearchParams(location.search);
      const vendorId = params.get("v");

      /* ── No vendor param (universal Saardha QR) — show the store picker ── */
      if (!vendorId) {
        await showStorePicker();
        return;
      }

      /* ── Fetch vendor info ── */
      const vendor = await fetchVendor(vendorId);
      currentVendor = vendor;

      if (!vendor) {
        card.innerHTML = `
          <div class="app-logo">🚚</div>
          <div class="app-name">Saardha</div>
          <div class="error">Store not found. Please try scanning again.</div>
          <a class="btn btn-primary" href="/customer/">Open App</a>
        `;
        return;
      }

      /* ── Already has app installed → just add store and redirect ── */
      if (isInstalled()) {
        const isNew = addVendor(vendorId);
        const total = getUnlocked().length;
        const banner = isNew
          ? `<div class="added-banner"><strong>✅ ${vendor.name} added!</strong>You can now order from ${vendor.name}</div>`
          : `<div class="already-banner"><strong>👍 Already in your app</strong>${vendor.name} is already available</div>`;
        card.innerHTML = `
          <div class="app-logo">🚚</div>
          <div class="app-name">Saardha</div>
          <hr class="divider" />
          <div class="vendor-emoji">${vendor.img}</div>
          <div class="vendor-name">${vendor.name}</div>
          <div class="vendor-meta">${vendor.category} · ${vendor.area}</div>
          ${banner}
          <a class="btn btn-primary" href="${customerUrl(vendor)}">Shop Now →</a>
          <div class="stores-count">You have <span>${total}</span> store${total !== 1 ? "s" : ""} unlocked</div>
          <div class="countdown" id="countdown"></div>
        `;
        startCountdown(3, () => { window.location.href = customerUrl(vendor); });
        return;
      }

      /* ── New user — show install flow based on device ── */
      addVendor(vendorId); // save store so it's ready after install

      if (isAndroid()) {
        showAndroidInstall(vendor);
      } else if (isIOS()) {
        showIOSInstall(vendor);
      } else {
        /* Desktop — show get-started page */
        card.innerHTML = `
          <div class="app-logo">🚚</div>
          <div class="app-name">Saardha</div>
          <div class="app-tagline">On-demand local delivery</div>
          <hr class="divider" />
          <div class="vendor-emoji">${vendor.img}</div>
          <div class="vendor-name">${vendor.name}</div>
          <div class="vendor-meta">${vendor.category} · ${vendor.area}</div>
          <div class="ready-badge">⚡ Ready to deliver</div>
          <a class="btn btn-primary" href="${customerUrl(vendor)}">Open on Desktop →</a>
          <p style="color:#555;font-size:12px;margin-top:14px">Scan this QR from your phone to install the app</p>
        `;
      }
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }

    init();
  </script>
</body>
</html>
